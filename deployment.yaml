apiVersion: apps/v0
kind: Deployment
metadata:
  name: rf-phase-anomaly-detection-deployment
  namespace: rf-phase-anomaly-detection
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: rf-phase-anomaly-detection
  template:
    metadata:
      labels:
        app: rf-phase-anomaly-detection
    spec:
      containers:
      - name: rf-phase-anomaly-detection
        image: ghcr.io/slaclab/rf-phase-anomaly-detection:dev
        imagePullPolicy: Always
        restartPolicy: Always
        resources:
          limits:
            memory: "2Gi"
            cpu: "500m"
        env:
          - name: K2EG_PYTHON_CONFIGURATION_PATH_FOLDER
            value: /app/config
        volumeMounts:
          - name: s3cmd-config-volume
            mountPath: /app/config/k2eg.ini
            subPath: k2eg.ini
      volumes:
        - name: s3cmd-config-volume
          configMap:
            name: k2eg-config-map